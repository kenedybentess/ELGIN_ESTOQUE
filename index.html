<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WMS Controle - Import Fix</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui,sans-serif;background:#0e0e10;color:#fafafa}</style>
</head>
<body class="min-h-screen p-6">
<div class="max-w-[900px] mx-auto">
  <h1 class="text-xl font-bold">WMS - Importador Corrigido</h1>
  <p class="text-zinc-400 text-sm mt-1">Arraste sua planilha aqui ou clique nos botões. Versão sem esm.sh</p>

  <div id="drop" class="mt-6 border-2 border-dashed border-zinc-700 rounded-xl p-10 text-center hover:border-zinc-500 transition bg-[#151518]">
    <p class="text-sm">Solte o arquivo aqui (XLSX, CSV, TXT)</p>
    <p class="text-[11px] text-zinc-500 mt-2">Ou use os botões abaixo</p>
    <div class="flex gap-2 justify-center mt-4">
      <button id="btnXlsx" class="bg-white text-black rounded-full px-4 py-1.5 text-[12px] font-semibold">IMPORTAR XLSX</button>
      <button id="btnCsv" class="bg-[#1e1e20] border border-zinc-800 rounded-full px-4 py-1.5 text-[12px]">IMPORTAR CSV</button>
      <button id="btnTxt" class="bg-[#1e1e20] border border-zinc-800 rounded-full px-4 py-1.5 text-[12px]">IMPORTAR TXT</button>
    </div>
  </div>

  <div id="log" class="mt-4 text-[12px] font-mono bg-[#151518] border border-zinc-800 rounded-lg p-3 min-h-[60px]">Pronto para importar...</div>

  <div class="mt-6">
    <h2 class="text-[12px] tracking-widest text-zinc-400">PREVIEW</h2>
    <div class="overflow-auto mt-2 border border-zinc-800 rounded-lg">
      <table class="w-full text-[11px]"><thead class="bg-[#1e1e20] text-zinc-400"><tr><th class="p-2 text-left">MATERIAL</th><th class="p-2 text-left">TEXTO BREVE</th><th class="p-2">UTILIZAÇÃO</th><th class="p-2">UM</th><th class="p-2">DEPÓSITO</th></tr></thead><tbody id="tbody"></tbody></table>
    </div>
  </div>

  <input id="fileXlsx" type="file" accept=".xlsx,.xls" class="hidden">
  <input id="fileCsv" type="file" accept=".csv" class="hidden">
  <input id="fileTxt" type="file" accept=".txt,.csv" class="hidden">
</div>

<script>
const logEl = document.getElementById('log');
const tbody = document.getElementById('tbody');
function log(m){ logEl.textContent = new Date().toLocaleTimeString() + ' - ' + m; console.log(m); }

function addRows(rows){
  tbody.innerHTML='';
  rows.slice(0,200).forEach(r=>{
    let mat = r.material||r.MATERIAL||r[0]||'';
    let txt = r.texto||r.TEXTO_BREVE||r['TEXTO BREVE']||r[1]||'';
    let ut = r.utilizacao||r.UTILIZACAO_LIVRE||r['UTILIZAÇÃO LIVRE']||r[2]||0;
    let um = r.um||r.UM||r[3]||'PC';
    let dep = r.deposito||r.DEPOSITO||r[4]||'DG25';
    if(!mat && !txt) return;
    let tr=document.createElement('tr');
    tr.className='border-t border-zinc-800';
    tr.innerHTML=`<td class="p-2">${mat}</td><td class="p-2">${txt}</td><td class="p-2 text-center">${ut}</td><td class="p-2 text-center">${um}</td><td class="p-2 text-center">${dep}</td>`;
    tbody.appendChild(tr);
  });
  // Save to localStorage to reuse in original app
  localStorage.setItem('wms_import_last', JSON.stringify(rows));
  log(`✓ ${rows.length} linhas processadas (mostrando ${Math.min(rows.length,200)}) - Salvo no localStorage`);
  // Try to push to original app structure
  try{
    let existing = JSON.parse(localStorage.getItem('wms_final_material_livre')||'[]');
    log(`Para usar no app original, copie os dados. Total local: ${existing.length}`);
  }catch{}
}

async function handleXlsx(file){
  log(`Lendo XLSX ${file.name}... ${file.size} bytes`);
  if(!window.XLSX){ log('ERRO: Biblioteca XLSX não carregou. Verifique internet para jsdelivr'); return; }
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const first = wb.SheetNames[0];
    const sheet = wb.Sheets[first];
    const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if(!json.length){ log('Planilha vazia! Verifique se a primeira aba tem dados'); return; }
    log(`✓ Aba ${first} - ${json.length} linhas`);
    addRows(json);
  }catch(e){ log('ERRO XLSX: '+e.message); console.error(e); alert('Erro ao ler XLSX: '+e.message); }
}

async function handleCsv(file){
  log(`Lendo CSV ${file.name}...`);
  const text = await file.text();
  const lines = text.split(/\r?\n/).filter(Boolean);
  if(!lines.length){ log('Arquivo vazio'); return; }
  const headers = lines[0].split(/[;,]/).map(h=>h.trim().toLowerCase());
  const hasHeader = headers.some(h=>h.includes('material')||h.includes('texto')||h.includes('utiliz'));
  const dataLines = hasHeader? lines.slice(1): lines;
  const rows = dataLines.map(l=>{
    const cols = l.split(/[;,]/).map(c=>c.trim());
    if(hasHeader){ let obj={}; headers.forEach((h,i)=>obj[h]=cols[i]); return obj; }
    return cols;
  });
  addRows(rows);
}

async function handleTxt(file){
  log(`Lendo TXT ${file.name}...`);
  const text = await file.text();
  const lines = text.split(/\r?\n/).filter(Boolean);
  const rows = lines.map(l=>{
    let cols = l.split(/[;,\t|]/).map(c=>c.trim());
    if(cols.length===1){ cols = l.split(/\s{2,}/); }
    return cols;
  });
  addRows(rows);
}

const fx=document.getElementById('fileXlsx'), fc=document.getElementById('fileCsv'), ft=document.getElementById('fileTxt');
document.getElementById('btnXlsx').onclick=()=>fx.click();
document.getElementById('btnCsv').onclick=()=>fc.click();
document.getElementById('btnTxt').onclick=()=>ft.click();
fx.onchange=e=>{ if(e.target.files[0]) handleXlsx(e.target.files[0]); e.target.value=''; };
fc.onchange=e=>{ if(e.target.files[0]) handleCsv(e.target.files[0]); e.target.value=''; };
ft.onchange=e=>{ if(e.target.files[0]) handleTxt(e.target.files[0]); e.target.value=''; };

const drop=document.getElementById('drop');
drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('border-white'); });
drop.addEventListener('dragleave', e=>{ drop.classList.remove('border-white'); });
drop.addEventListener('drop', e=>{
  e.preventDefault(); drop.classList.remove('border-white');
  const f=e.dataTransfer.files[0]; if(!f) return;
  if(f.name.endsWith('.xlsx')||f.name.endsWith('.xls')) handleXlsx(f);
  else if(f.name.endsWith('.csv')) handleCsv(f);
  else handleTxt(f);
});
log('Importador pronto. XLSX via jsdelivr carregado: '+(!!window.XLSX));
</script>
</body>
</html>
